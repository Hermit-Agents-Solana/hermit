<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body><div id="stage"></div>
<script>
// The hermit: a spiral shell with a claw out front. Tile, shell, one accent, drawn on a 400x400 box.
const T = '#0c4f4b', S = '#f7e8c9', C = '#ff5a36', K = '#0a2e2c';
const spiral = (cx, cy, r0, turns, a0, r1) => { let d = ''; const n = 90; for (let i = 0; i <= n; i++) { const k = i / n, a = a0 + k * turns * Math.PI * 2, r = r0 + (r1 - r0) * k; d += `${i ? 'L' : 'M'}${(cx + Math.cos(a) * r).toFixed(1)} ${(cy + Math.sin(a) * r).toFixed(1)} `; } return d; };
// claw: a fat pincer opening up and left
const claw = (x, y, s, r, col) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><path d="M0 0 C-14 -40 -8 -84 34 -108 L52 -74 C34 -62 30 -48 34 -36 L92 -56 C100 -22 76 12 36 20 C20 24 6 16 0 0 Z" fill="${col}"/></g>`;
const stalks = (x, y, col, eye) => `<path d="M${x} ${y} L${x - 18} ${y - 52} M${x + 40} ${y} L${x + 40} ${y - 58}" stroke="${col}" stroke-width="15" stroke-linecap="round"/><rect x="${x - 34}" y="${y - 66}" width="30" height="13" rx="3" fill="${eye}" transform="rotate(-14 ${x - 18} ${y - 60})"/><rect x="${x + 25}" y="${y - 72}" width="30" height="13" rx="3" fill="${eye}" transform="rotate(14 ${x + 40} ${y - 66})"/>`;
const A = `<path d="M46 332 L352 332 C366 250 352 92 214 64 C110 44 40 120 56 222 C60 260 54 300 46 332 Z" fill="${S}"/>`;
const CLAW = `<path d="M254 296 C232 258 170 246 120 258 C84 266 54 290 38 324 C80 304 120 304 152 316 C120 326 92 342 72 366 C120 380 194 376 230 352 C248 340 260 318 254 296 Z" fill="${C}"/>`;
const CRAB = `<g transform="translate(20 22) scale(.9)"><circle cx="244" cy="158" r="122" fill="${S}"/><path d="${spiral(244, 158, 6, 1.6, 1.0, 94)}" fill="none" stroke="${T}" stroke-width="24" stroke-linecap="round"/><path d="M74 138 L96 224 M124 112 L130 212" stroke="${C}" stroke-width="18" stroke-linecap="round"/><rect x="48" y="118" width="46" height="18" rx="4" fill="${S}" transform="rotate(-16 71 127)"/><rect x="100" y="90" width="46" height="18" rx="4" fill="${S}" transform="rotate(12 123 99)"/><path d="M84 256 C74 214 108 196 156 204 L210 262 Z" fill="${C}"/>${CLAW}</g>`;
// The mark: a chambered shell. Each chamber is an entry, the newest one is coral. Fitted into a circle of radius 164 so a round crop keeps it whole.
const whorl = (a) => Math.exp(a * Math.log(2.3) / (Math.PI * 2));
const TOP = Math.PI * .86, STEP = Math.PI / 4, ROOMS = 15, END = TOP - ROOMS * STEP;
const sweep = (a1, a2, n) => Array.from({ length: n + 1 }, (_, i) => { const a = a1 + (a2 - a1) * i / n, k = whorl(a - TOP); return [Math.cos(a) * k, Math.sin(a) * k]; });
const fit = (() => { const p = sweep(TOP - Math.PI * 2, TOP, 120); let c = [0, 0]; for (let i = 1; i < 4000; i++) { const f = p.reduce((b, q) => Math.hypot(q[0] - c[0], q[1] - c[1]) > Math.hypot(b[0] - c[0], b[1] - c[1]) ? q : b); c = [c[0] + (f[0] - c[0]) / (i + 1), c[1] + (f[1] - c[1]) / (i + 1)]; } const R = Math.max(...p.map((q) => Math.hypot(q[0] - c[0], q[1] - c[1]))); return { s: 164 / R, x: 200 - c[0] * 164 / R, y: 200 - c[1] * 164 / R }; })();
const place = (l) => l.map(([x, y]) => `${(fit.x + x * fit.s).toFixed(1)} ${(fit.y + y * fit.s).toFixed(1)}`).join(' L');
const room = (a1, a2) => `M${place(sweep(a1, a2, 16))} L${place(sweep(a2 - Math.PI * 2, a1 - Math.PI * 2, 16))} Z`;
const MARK = Array.from({ length: ROOMS }, (_, i) => { const a2 = TOP - i * STEP; return `<path d="${room(a2 - STEP, a2)}" fill="${i ? S : C}" stroke="${T}" stroke-width="${Math.max(7, fit.s * whorl(a2 - TOP) * .05).toFixed(1)}" stroke-linejoin="round"/>`; }).join('') + `<path d="M${place(sweep(END - Math.PI * 2, END, 60))} Z" fill="${S}" stroke="${T}" stroke-width="7" stroke-linejoin="round"/>`;
const m = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">${MARK}</g>`;
const hash = location.hash.slice(1) || 'avatar';
const svg = {
  avatar: `<svg width="1000" height="1000" viewBox="0 0 1000 1000"><rect width="1000" height="1000" fill="${T}"/>${m(0, 0, 2.5)}</svg>`,
  logo: `<svg width="800" height="800" viewBox="0 0 800 800"><rect width="800" height="800" fill="${T}"/>${m(0, 0, 2)}</svg>`,
  small: `<svg width="48" height="48" viewBox="0 0 400 400" style="border-radius:50%"><rect width="400" height="400" fill="${T}"/>${MARK}</svg>`,
  header: `<svg width="1500" height="500" viewBox="0 0 1500 500"><rect width="1500" height="500" fill="${T}"/><text x="90" y="225" font-family="Unbounded" font-weight="900" font-size="84" fill="${S}">THE NEXT AGENT</text><text x="90" y="335" font-family="Unbounded" font-weight="900" font-size="84" fill="${C}">MOVES RIGHT IN</text>${m(1050, 40, 1.05)}</svg>`,
  og: `<svg width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="${T}"/><text x="60" y="210" font-family="Unbounded" font-weight="900" font-size="104" fill="${S}">HERMIT</text><text x="62" y="300" font-family="Unbounded" font-weight="800" font-size="40" fill="${C}">The next agent</text><text x="62" y="352" font-family="Unbounded" font-weight="800" font-size="40" fill="${C}">moves right in</text><text x="62" y="450" font-family="JetBrains Mono" font-weight="500" font-size="25" fill="${S}">shared memory for coding agents</text><text x="62" y="488" font-family="JetBrains Mono" font-weight="500" font-size="25" fill="${S}">with a log you can check on Solana</text>${m(650, 110, 1.3)}</svg>`,
  sheet: `<svg width="620" height="360" viewBox="0 0 620 360"><rect width="620" height="360" fill="#fff"/><g transform="translate(0 0) scale(.9)"><rect width="400" height="400" fill="${T}"/>${MARK}</g><g transform="translate(380 20)"><circle cx="48" cy="48" r="48" fill="${T}"/><g transform="scale(.24)">${MARK}</g></g><g transform="translate(500 44)"><circle cx="24" cy="24" r="24" fill="${T}"/><g transform="scale(.12)">${MARK}</g></g></svg>`,
}[hash];
document.getElementById('stage').innerHTML = svg;
</script></body></html>
